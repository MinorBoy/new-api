services:
  mysql:
    image: mysql:5.7.44
    environment:
      MYSQL_DATABASE: newapi
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '13306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - config-import-mysql:/var/lib/mysql

  postgres:
    image: postgres:9.6
    environment:
      POSTGRES_DB: newapi
      POSTGRES_PASSWORD: config_import_test
      POSTGRES_USER: postgres
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - config-import-postgres:/var/lib/postgresql/data
      - ./docker/config-import-postgres-pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ['postgres', '-c', 'listen_addresses=*', '-c', 'hba_file=/etc/postgresql/pg_hba.conf']

volumes:
  config-import-mysql:
    name: new-api-config-import-mysql-test
  config-import-postgres:
    name: new-api-config-import-postgres-test
